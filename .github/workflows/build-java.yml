name: Build Java Yolks

on:
  push:
    branches:
      - main
    paths:
      - "java/**"
      - "entrypoint.sh"
      - ".github/workflows/build-java.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Java ${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - "7"
          - "8"
          - "11"
          - "16"
          - "17"
          - "18"
          - "19"
          - "21"
          - "22"
          - "23"
          - "24"
          - "25"
          - "26"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./java/${{ matrix.version }}/Dockerfile
          push: true
          tags: |
            ghcr.io/acore-hosting/yolks:java_${{ matrix.version }}
